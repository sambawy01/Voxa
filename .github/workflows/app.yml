name: App

# The native app (app/): Rust core and Tauri shell, plus the UI's logic tests.
# Linux runs the full checks; macOS and Windows check that the app builds there.
on:
  push:
    paths: [app/**, licence-server/**, .github/workflows/app.yml]
  pull_request:
    paths: [app/**, licence-server/**, .github/workflows/app.yml]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          # sherpa-onnx-sys downloads its static libraries here and records the path in its
          # build-script output. rust-cache restores that output but not this folder, so on
          # an exact cache hit the linker finds no library. Cache the folder too.
          cache-directories: app/target/sherpa-onnx-prebuilt
          # New key so caches saved without that folder are never restored.
          prefix-key: v2-sherpa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Licence end-to-end (the app's client against the real Python licence server)
        run: |
          pip install cryptography
          cargo test -p voxa-app -- --ignored licence_e2e
      - run: npm ci
      # The mobile layout test renders the UI in headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Compile the packaging tools
        run: python3 -m py_compile tools/*.py
      - name: Licence gate (no GPL in the app) and credits list up to date
        run: python3 -I tools/licences.py --check
      - run: python3 -I tools/android_setup.py --self-test

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          # sherpa-onnx-sys downloads its static libraries here and records the path in its
          # build-script output. rust-cache restores that output but not this folder, so on
          # an exact cache hit the linker finds no library. Cache the folder too.
          cache-directories: app/target/sherpa-onnx-prebuilt
          # New key so caches saved without that folder are never restored.
          prefix-key: v2-sherpa
      - run: cargo build -p voxa-app
      # voxa-engines links sherpa-onnx statically: prove it links on every OS.
      - run: cargo test -p voxa-core -p voxa-g2p -p voxa-engines -p voxa-models

  # Unsigned Android build (roadmap M10b). Signing and the Play Store need the owner's
  # accounts. The Android project is generated by `tauri android init` on every run and
  # patched by tools/android_setup.py (microphone permission), so nothing generated is
  # committed.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          cache-directories: app/target/sherpa-onnx-prebuilt
          prefix-key: v2-sherpa-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate the Android project
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          python3 -I tools/android_setup.py src-tauri/gen/android
      - name: Build an unsigned release APK (arm64)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 --ci
      - name: Check the APK (native libraries and microphone permission)
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk" || { echo "no APK built"; exit 1; }
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/.*\.so' | tee libs.txt
          grep -q 'libvoxa_app_lib.so' libs.txt
          grep -q 'libsherpa-onnx-c-api.so' libs.txt
          grep -q 'libonnxruntime.so' libs.txt
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump permissions "$apk" | tee perms.txt
          grep -q 'android.permission.RECORD_AUDIO' perms.txt
          grep -q 'android.permission.INTERNET' perms.txt
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: voxa-android-unsigned
          path: app/${{ env.APK_PATH }}
          retention-days: 14
