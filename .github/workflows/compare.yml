name: Voice comparison

# The listening test: the same paragraph per language from every candidate engine, saved with
# timings to the tts-compare-results branch.
# - On-device engines (gpu/compare_device.py) run on the GitHub runner's CPU; no secrets needed.
# - Studio engines (gpu/compare.py) run on a Modal L4 when the MODAL_TOKEN_ID and
#   MODAL_TOKEN_SECRET repository secrets are set; otherwise that half is skipped with a notice.
on:
  push:
    branches: [feat/compare-v2]
    paths: [gpu/compare.py, gpu/compare_device.py, .github/workflows/compare.yml]
  workflow_dispatch:
    inputs:
      engines:
        description: Studio engines to run (comma-separated), or all
        default: all

concurrency:
  group: tts-compare
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the on-device engines
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu \
            supertonic pocket-tts soundfile numpy onnx onnxruntime tokenizers huggingface_hub
          git clone -q --depth 1 https://github.com/HojoAI/Hojo-TTS-Light.git /tmp/hojo

      - name: On-device clips
        run: HOJO_REPO=/tmp/hojo python gpu/compare_device.py out/compare 2>&1 | grep -vE 'it/s|Fetching'

      - name: Studio clips (Modal)
        continue-on-error: true
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::notice::Studio engines skipped: add the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET repository secrets, then re-run."
            exit 0
          fi
          pip install -q modal==1.6.2
          engines="${{ inputs.engines || 'all' }}"
          if [ "$engines" = all ]; then modal run gpu/compare.py --out out/compare
          else modal run gpu/compare.py --out out/compare --engines "$engines"; fi

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          rows = json.load(open('out/compare/results.json'))['rows']
          print('| Engine | Language | Seconds to make | Seconds of audio | Note |\n| --- | --- | --- | --- | --- |')
          for r in rows:
              print(f"| {r.get('engine_name', r['engine'])} | {r.get('lang', '')} | {r.get('gen_seconds', '')} | {r.get('audio_seconds', '')} | {r.get('error', '')[:80]} |")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tts-compare
          path: out/compare

      - name: Save to the results branch
        run: |
          cd out/compare
          git init -q -b tts-compare-results
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Voice comparison from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tts-compare-results
