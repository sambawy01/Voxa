name: Deploy to Fly

# Run by hand (Actions → Deploy to Fly → Run workflow), from any branch; normally main.
# Needs the repository secret FLY_API_TOKEN (a Fly deploy token for the app).
on:
  workflow_dispatch:

concurrency: fly-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the token is set
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add the repository secret FLY_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Make sure the data volume exists
        # fly.toml mounts the volume voxa_data at /data (visitor counts, API jobs). Fly does not
        # create it on deploy, so create it once, in the region the app's machine runs in.
        run: |
          if flyctl volumes list --app voxa-zpukmw --json | grep -q '"name": *"voxa_data"'; then
            echo "voxa_data exists"
          else
            region=$(flyctl machines list --app voxa-zpukmw --json | grep -o '"region": *"[a-z]*"' | head -1 | grep -o '[a-z]*"$' | tr -d '"')
            region=${region:-fra}
            echo "creating voxa_data (1 GB) in $region"
            flyctl volumes create voxa_data --app voxa-zpukmw --region "$region" --size 1 --yes
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy
        run: flyctl deploy --remote-only --app voxa-zpukmw
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the site
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://voxa-zpukmw.fly.dev/health; then echo; break; fi
            sleep 10
          done
          # /listen and /pricing redirect home while the site is on-device only (ON_DEVICE_ONLY=1),
          # so they must answer 200 or that redirect.
          for p in / /podcast /book /integrations /storage /voxa.css /listen /pricing; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://voxa-zpukmw.fly.dev$p)
            echo "$code $p" | tee -a "$GITHUB_STEP_SUMMARY"
            case "$p:$code" in
              *:200|/listen:302|/pricing:302) ;;
              *) exit 1 ;;
            esac
          done
