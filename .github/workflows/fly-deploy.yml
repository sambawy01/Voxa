name: Deploy to Fly

# Run by hand (Actions → Deploy to Fly → Run workflow), from any branch; normally main.
# Needs the repository secret FLY_API_TOKEN (a Fly deploy token for the app).
on:
  workflow_dispatch:

concurrency: fly-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the token is set
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add the repository secret FLY_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy
        run: flyctl deploy --remote-only --app voxa-zpukmw
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the site
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://voxa-zpukmw.fly.dev/health; then echo; break; fi
            sleep 10
          done
          for p in / /listen /podcast /book /pricing /voxa.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://voxa-zpukmw.fly.dev$p)
            echo "$code $p" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = 200 ] || exit 1
          done
