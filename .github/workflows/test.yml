name: Test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile server.py scripts/smoke.py
      - name: Unit tests (generation stubbed; no torch needed)
        run: python -m unittest discover -s tests -v
