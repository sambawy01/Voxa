[package]
name = "voxa-licence"
description = "Voxa licence files: offline verification, device id, and the activation client."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
machine-uid = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
