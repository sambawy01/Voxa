[package]
name = "voxa-models"
description = "Voxa's model catalogue (signed), downloader and on-disk model store."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = "3"

[features]
# Lets tests in other crates download from a local plain-http server. Never enable in the app.
test-http = []

[dev-dependencies]
tempfile = "3"
