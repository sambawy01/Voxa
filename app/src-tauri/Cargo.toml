[package]
name = "voxa-app"
description = "Voxa: text to speech that runs on your device."
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "voxa_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
memory-stats = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
voxa-core = { path = "../crates/voxa-core" }
voxa-engines = { path = "../crates/voxa-engines" }
voxa-g2p = { path = "../crates/voxa-g2p" }
voxa-licence = { path = "../crates/voxa-licence" }
voxa-models = { path = "../crates/voxa-models" }

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
voxa-models = { path = "../crates/voxa-models", features = ["test-http"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3"
