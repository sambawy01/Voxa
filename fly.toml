# fly.toml — Voxa, server-side Kokoro TTS
app = "voxa-zpukmw"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "180s"
    method = "GET"
    path = "/health"

[[vm]]
  # Both Kokoro (~1.26 GB resident) and Habibi Arabic (~1.35 GB) need to be live at once,
  # plus two runtimes. 2 GB measurably could not hold even two Kokoro pipelines; 4 GB does.
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
