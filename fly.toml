# fly.toml — Voxa, server-side Kokoro TTS
app = "voxa-zpukmw"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "180s"
    method = "GET"
    path = "/health"

[[vm]]
  # Measured with all nine language pipelines loaded, after a 4,000-character job:
  # 2.3 GB resident, 2.9 GB peak. One generation runs at a time, so this does not stack;
  # 2 GB measurably could not hold even two Kokoro pipelines.
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
