# fly.toml — Voxa, server-side Kokoro TTS
app = "voxa-zpukmw"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # "1" hides the Studio (server) voices and serves only the on-device voices.
  # Set to "0" to bring the Studio voices, Audiobooks, Podcasts and Pricing back.
  ON_DEVICE_ONLY = "1"
  # The API for AI agents (/v1, /mcp): keys as name:sha256 of the key, never the key itself.
  # Add a key: python3 -c "import hashlib,secrets;k='vx_'+secrets.token_urlsafe(32);print(k, hashlib.sha256(k.encode()).hexdigest())"
  VOXA_API_KEYS = "owner:a7e79a8cbbdb1b756e59791dcf2b5837b7e4e1db67f0c1ff9de5d31b1d2f0634"
  VOXA_API_DAILY_CHARS = "300000"

# Lasting data (visitor counts, API jobs) lives on a volume at /data, so it survives deploys.
# The deploy workflow creates the volume (1 GB) if it is missing, in the machine's region.
[mounts]
  source = "voxa_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "180s"
    method = "GET"
    path = "/health"

[[vm]]
  # Measured with all nine language pipelines loaded, after a 4,000-character job:
  # 2.3 GB resident, 2.9 GB peak. One generation runs at a time, so this does not stack;
  # 2 GB measurably could not hold even two Kokoro pipelines.
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
